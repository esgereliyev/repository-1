<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

</head>
<body>
    <div id="left">
        <h1 id="unity"><i class="fa-solid fa-gamepad" id="unity-i" color></i> Unity.</h1>
        <p id="platform-kit">A Video Gaming Platform UI Kit</p>
        <div>
            <div id="callofduty">   
                <img src="img/cod.jpg" alt="">
                <ul>
                    <li class="li1">Call of Duty</li>
                    <li class="li2">Shooting</li>
                    <li class="li3"><a href="https://www.twitch.tv/directory/category/call-of-duty" target="_blank"><i class="fa-brands fa-twitch"></i>2.8K viewers</a></li>
                </ul>
            </div>
            <div id="dota">
                <img src="img/dota2.webp" alt="">
                <ul>
                    <li class="li1">The Dota 2</li>
                    <li class="li2">eSport</li>
                    <li class="li3"><a href="https://www.twitch.tv/directory/category/dota-2" target="_blank"><i class="fa-brands fa-twitch"></i>2.8K viewers</a></li>
                </ul>
            </div>
            <div id="lol">
                <img src="img/lol.jpg" alt="">
                <ul>
                    <li class="li1">Legends</li>
                    <li class="li2">Online Game</li>
                    <li class="li3"><a href="https://www.twitch.tv/directory/category/league-of-legends" target="_blank"><i class="fa-brands fa-twitch"></i>2.8K viewers</a></li>
                </ul>
            </div>
            <p id="discover"><i class="fa-solid fa-plus"></i>Discover more</p>
        </div>
    </div>
    <div id="form">
        <h1>Sign in</h1>
        <i class="fa-solid fa-x" id="form-i"></i>
        <br>
        <p class="user">New user?</p>
        <p class="user"><a href="#">Create an account</a></p> 
        <form action="">
            <p class="placeholders" >Username or emails</p>
            <input type="text" />
            <p class="placeholders">Password</p>
            <input type="password">
            <input id="button" type="button" value="Continue">
            <p id="continue">Or continue with</p>
            <input id="google" type="button" value="Google">
        </form>
    </div>
</body>
</html>
